        };
        const ALL_TEAMS = Object.keys(TEAM_CODES);

        const UEFA_TEAMS = [
            "Albania", "Andorra", "Armenia", "Austria", "Azerbaijan", "Belarus", "Belgium", 
            "Bosnia and Herzegovina", "Bulgaria", "Croatia", "Cyprus", "Czech Republic",

            "Israel", "Italy", "Kazakhstan", "Kosovo", "Latvia", "Liechtenstein",

            "Romania", "Russia", "San Marino", "Scotland", "Serbia", "Slovakia",

        ];

        const Icon = ({ name, className }) => {
            const icons = {
                'menu': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,

                'download': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>,
                'upload': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>,
                'power': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg>,

                'arrow-left': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>,

                'award': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>,
                'chevron-up': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>,
                'chevron-down': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,
                'refresh-cw': <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>

        };

        const getFlagUrl = (teamName) => {
            if (!teamName || typeof teamName !== 'string') return "";
            if (teamName === 'TBD' || teamName.includes('Grp') || teamName.includes('Best')) return "";
            const code = TEAM_CODES[teamName];
            if (code) return `https://flagcdn.com/w40/${code.toLowerCase()}.png`;
            return `https://placehold.co/40x40/1e293b/ffffff?text=${encodeURIComponent(teamName.trim().substring(0, 1).toUpperCase() || 'X')}`;
        };

        const getAbbr = (teamName) => {
            if (!teamName || typeof teamName !== 'string') return "";
            if (teamName === 'TBD' || teamName.includes('Grp') || teamName.includes('Best')) return teamName;
            const mapping = {
                "Afghanistan": "AFG", "Albania": "ALB", "Algeria": "ALG", "Andorra": "AND", "Angola": "ANG",
                "Argentina": "ARG", "Armenia": "ARM", "Australia": "AUS", "Austria": "AUT", "Azerbaijan": "AZE",
                "Belgium": "BEL", "Bolivia": "BOL", "Bosnia and Herzegovina": "BIH", "Brazil": "BRA", "Bulgaria": "BUL",
                "Cabo Verde": "CPV", "Cameroon": "CMR", "Canada": "CAN", "Chile": "CHI", "China": "CHN",
                "Colombia": "COL", "Costa Rica": "CRC", "Croatia": "CRO", "Curaçao": "CUW", "Czech Republic": "CZE",
                "Denmark": "DEN", "Ecuador": "ECU", "Egypt": "EGY", "England": "ENG", "Estonia": "EST",
                "France": "FRA", "Germany": "GER", "Ghana": "GHA", "Greece": "GRE", "Honduras": "HON",
                "Hungary": "HUN", "Iceland": "ISL", "Iran": "IRN", "Iraq": "IRQ", "Italy": "ITA",
                "Ivory Coast": "CIV", "Jamaica": "JAM", "Japan": "JPN", "Mexico": "MEX", "Morocco": "MAR",
                "Netherlands": "NED", "New Zealand": "NZL", "Nigeria": "NGA", "North Korea": "PRK", "Norway": "NOR",
                "Paraguay": "PAR", "Peru": "PER", "Poland": "POL", "Portugal": "POR", "Qatar": "QAT",
                "Romania": "ROU", "Russia": "RUS", "Saudi Arabia": "KSA", "Scotland": "SCO", "Senegal": "SEN",
                "Serbia": "SRB", "Slovakia": "SVK", "Slovenia": "SVN", "South Africa": "RSA", "South Korea": "KOR",
                "Spain": "ESP", "Sweden": "SWE", "Switzerland": "SUI", "Tunisia": "TUN", "Turkey": "TUR",
                "Ukraine": "UKR", "United Arab Emirates": "UAE", "United States": "USA", "Uruguay": "URU",
                "Wales": "WAL"
            };
            return mapping[teamName] || teamName.trim().substring(0, 3).toUpperCase();
        };

        const calculateStandings = (groupTeams, matches) => {
            let standings = groupTeams.map(team => ({ team, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
            matches.forEach(m => {
                if (m.homeScore !== null && m.awayScore !== null) {
                    let home = standings.find(s => s.team === m.homeTeam);
                    let away = standings.find(s => s.team === m.awayTeam);
                    if (home && away) {
                        const hS = Number(m.homeScore);
                        const aS = Number(m.awayScore);
                        home.p++; away.p++;
                        home.gf += hS; home.ga += aS;
                        away.gf += aS; away.ga += hS;
                        home.gd = home.gf - home.ga; away.gd = away.gf - away.ga;
                        if (hS > aS) { home.w++; home.pts += 3; away.l++; }
                        else if (hS < aS) { away.w++; away.pts += 3; home.l++; }
                        else { home.d++; away.d++; home.pts += 1; away.pts += 1; }
                    }
                }
            });
            standings.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.w !== a.w) return b.w - a.w;
                if (b.gd !== a.gd) return b.gd - a.gd;
                if (b.gf !== a.gf) return b.gf - a.gf;
                const h2h = matches.find(m => (m.homeTeam === a.team && m.awayTeam === b.team) || (m.homeTeam === b.team && m.awayTeam === a.team));
                if (h2h && h2h.homeScore !== null && h2h.awayScore !== null && h2h.homeScore !== h2h.awayScore) {
                    if (h2h.homeTeam === a.team && Number(h2h.homeScore) > Number(h2h.awayScore)) return -1;
                    if (h2h.homeTeam === b.team && Number(h2h.awayScore) > Number(h2h.homeScore)) return -1;
                    if (h2h.awayTeam === a.team && Number(h2h.awayScore) > Number(h2h.homeScore)) return -1;
                    if (h2h.awayTeam === b.team && Number(h2h.homeScore) > Number(h2h.awayScore)) return -1;
                }
                return 0;
            });
            return standings;
        };

        const getAllGroupStandings = (groups, matches) => {
            return groups.map((g, idx) => ({
                label: String.fromCharCode(65 + idx),
                standings: calculateStandings(g, matches.filter(m => m.group === String.fromCharCode(65 + idx)))
            }));
        };

        const generateFixtures = (finalGroups) => {
            let initialMatches = [];
            finalGroups.forEach((g, idx) => {
                let label = String.fromCharCode(65 + idx);
                let opps = [g[1], g[2], g[3]];
                for (let i = opps.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opps[i], opps[j]] = [opps[j], opps[i]];
                }
                
                initialMatches.push({ id: `G${idx}-1`, group: label, round: 1, homeTeam: g[0], awayTeam: opps[0], homeScore: null, awayScore: null });
                initialMatches.push({ id: `G${idx}-2`, group: label, round: 1, homeTeam: opps[1], awayTeam: opps[2], homeScore: null, awayScore: null });
                initialMatches.push({ id: `G${idx}-3`, group: label, round: 2, homeTeam: opps[1], awayTeam: g[0], homeScore: null, awayScore: null });
                initialMatches.push({ id: `G${idx}-4`, group: label, round: 2, homeTeam: opps[2], awayTeam: opps[0], homeScore: null, awayScore: null });
                initialMatches.push({ id: `G${idx}-5`, group: label, round: 3, homeTeam: g[0], awayTeam: opps[2], homeScore: null, awayScore: null });
                initialMatches.push({ id: `G${idx}-6`, group: label, round: 3, homeTeam: opps[0], awayTeam: opps[1], homeScore: null, awayScore: null });
            });
            return initialMatches;
        };

        const generateKnockoutBracket = (numGroups) => {
            let bracket = [];
            if (numGroups === 12) {
                for (let i = 1; i <= 16; i++) bracket.push({ id: `R32-${i}`, phase: 1, round: 'Round of 32', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `R16-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 8; i++) bracket.push({ id: `R16-${i}`, phase: 2, round: 'Round of 16', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `QF-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 4; i++) bracket.push({ id: `QF-${i}`, phase: 3, round: 'Quarterfinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `SF-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 2; i++) bracket.push({ id: `SF-${i}`, phase: 4, round: 'Semifinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: 'FIN', loserNext: '3RD' });
            } else if (numGroups === 8 || numGroups === 6) {
                for (let i = 1; i <= 8; i++) bracket.push({ id: `R16-${i}`, phase: 1, round: 'Round of 16', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `QF-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 4; i++) bracket.push({ id: `QF-${i}`, phase: 2, round: 'Quarterfinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `SF-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 2; i++) bracket.push({ id: `SF-${i}`, phase: 3, round: 'Semifinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: 'FIN', loserNext: '3RD' });
            } else if (numGroups === 4 || numGroups === 3) {
                for (let i = 1; i <= 4; i++) bracket.push({ id: `QF-${i}`, phase: 1, round: 'Quarterfinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: `SF-${Math.ceil(i/2)}` });
                for (let i = 1; i <= 2; i++) bracket.push({ id: `SF-${i}`, phase: 2, round: 'Semifinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: 'FIN', loserNext: '3RD' });
            } else if (numGroups === 2) {
                for (let i = 1; i <= 2; i++) bracket.push({ id: `SF-${i}`, phase: 1, round: 'Semifinals', homeTeam: `TBD`, awayTeam: `TBD`, homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: 'FIN', loserNext: '3RD' });
            }
            let finalPhase = bracket.reduce((max, m) => Math.max(max, m.phase), 0) + 1;
            bracket.push({ id: '3RD', phase: finalPhase, round: '3rd Place', homeTeam: 'TBD', awayTeam: 'TBD', homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: null });
            bracket.push({ id: 'FIN', phase: finalPhase, round: 'The Final', homeTeam: 'TBD', awayTeam: 'TBD', homeScore: null, awayScore: null, winner: null, homePen: null, awayPen: null, nextMatch: null });
            return bracket;
        };

        const syncBracketWithGroups = (groups, matches, numGroups, currentBracket) => {
            if (!currentBracket || currentBracket.length === 0) return currentBracket;
            const allStandings = getAllGroupStandings(groups, matches);
            let b = JSON.parse(JSON.stringify(currentBracket));

            const updateInitial = (id, home, away) => {
                let m = b.find(x => x.id === id);
                if (m) { m.homeTeam = home || 'TBD'; m.awayTeam = away || 'TBD'; }
            };

            const getTeam = (grpIndex, posIndex) => {
                if (grpIndex >= allStandings.length) return 'TBD';
                const st = allStandings[grpIndex].standings;
                return (st.length > posIndex && st[posIndex].p > 0) ? st[posIndex].team : `TBD`;
            };

            let allFirsts = [];
            let allSeconds = [];
            let allThirds = [];
            
            for (let i = 0; i < numGroups; i++) {
                if (allStandings[i]?.standings[0] && allStandings[i].standings[0].p > 0) allFirsts.push(allStandings[i].standings[0]);
                if (allStandings[i]?.standings[1] && allStandings[i].standings[1].p > 0) allSeconds.push(allStandings[i].standings[1]);
                if (allStandings[i]?.standings[2] && allStandings[i].standings[2].p > 0) allThirds.push(allStandings[i].standings[2]);
            }
            
            const sortFn = (a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf;
            allFirsts.sort(sortFn);
            allSeconds.sort(sortFn);
            allThirds.sort(sortFn);
            
            const getRankedTeam = (arr, index) => (arr && arr.length > index && arr[index].team) ? arr[index].team : 'TBD';

            if (numGroups === 2) {
                updateInitial('SF-1', getTeam(0, 0), getTeam(1, 1));
                updateInitial('SF-2', getTeam(1, 0), getTeam(0, 1));
            } else if (numGroups === 3) {
                updateInitial('QF-1', getTeam(0, 0), allThirds[1]?.team || 'TBD');
                updateInitial('QF-2', getTeam(1, 0), allThirds[0]?.team || 'TBD');
                updateInitial('QF-3', getTeam(2, 0), getTeam(0, 1));
                updateInitial('QF-4', getTeam(1, 1), getTeam(2, 1));
            } else if (numGroups === 4) {
                updateInitial('QF-1', getTeam(0, 0), getTeam(1, 1));
                updateInitial('QF-2', getTeam(2, 0), getTeam(3, 1));
                updateInitial('QF-3', getTeam(1, 0), getTeam(0, 1));
                updateInitial('QF-4', getTeam(3, 0), getTeam(2, 1));
            } else if (numGroups === 6) {
                let qualifiedThirds = allThirds.slice(0, 4);
                updateInitial('R16-1', getRankedTeam(allFirsts, 0), getRankedTeam(qualifiedThirds, 3));
                updateInitial('R16-2', getRankedTeam(allFirsts, 1), getRankedTeam(qualifiedThirds, 2));
                updateInitial('R16-3', getRankedTeam(allFirsts, 2), getRankedTeam(qualifiedThirds, 1));
                updateInitial('R16-4', getRankedTeam(allFirsts, 3), getRankedTeam(qualifiedThirds, 0));
                updateInitial('R16-5', getRankedTeam(allFirsts, 4), getRankedTeam(allSeconds, 5));
                updateInitial('R16-6', getRankedTeam(allFirsts, 5), getRankedTeam(allSeconds, 4));
                updateInitial('R16-7', getRankedTeam(allSeconds, 0), getRankedTeam(allSeconds, 3));
                updateInitial('R16-8', getRankedTeam(allSeconds, 1), getRankedTeam(allSeconds, 2));
            } else if (numGroups === 8) {
                for (let i = 0; i < 8; i++) {
                    updateInitial(`R16-${i + 1}`, getTeam(i, 0), getTeam((i + 1) % 8, 1));
                }
            } else if (numGroups === 12) {
                let qualifiedThirds = allThirds.slice(0, 8);
                for (let i = 0; i < 8; i++) {
                    updateInitial(`R32-${i + 1}`, getRankedTeam(allFirsts, i), getRankedTeam(qualifiedThirds, 7 - i));
                }
                for (let i = 0; i < 4; i++) {
                    updateInitial(`R32-${9 + i}`, getRankedTeam(allFirsts, 8 + i), getRankedTeam(allSeconds, 11 - i));
                }
                for (let i = 0; i < 4; i++) {
                    updateInitial(`R32-${13 + i}`, getRankedTeam(allSeconds, i), getRankedTeam(allSeconds, 7 - i));
                }
            }

            const phases = [...new Set(b.map(x => x.phase))].sort((a, b) => a - b);
            phases.forEach(p => {
                b.filter(x => x.phase === p).forEach(m => {
                    if (m.homeScore !== null && m.awayScore !== null) {
                        const hS = Number(m.homeScore); const aS = Number(m.awayScore);
                        if (hS > aS) m.winner = m.homeTeam;
                        else if (aS > hS) m.winner = m.awayTeam;
                        else {
                            if (m.homePen !== null && m.awayPen !== null) {
                                if (Number(m.homePen) > Number(m.awayPen)) m.winner = m.homeTeam;
                                else if (Number(m.awayPen) > Number(m.homePen)) m.winner = m.awayTeam;
                                else m.winner = null;
                            } else { m.winner = null; }
                        }
                    } else { m.winner = null; }

                    let next = b.find(x => x.id === m.nextMatch);
                    if (next) {
                        const matchNum = parseInt(m.id.split('-')[1]) || 1;
                        const isHomeSlot = matchNum % 2 !== 0;
                        if (m.winner) {
                            if (isHomeSlot) { if (next.homeTeam !== m.winner) next.homeTeam = m.winner; }
                            else { if (next.awayTeam !== m.winner) next.awayTeam = m.winner; }
                        } else {
                            if (isHomeSlot) { if (next.homeTeam !== 'TBD') { next.homeTeam = 'TBD'; next.homeScore = null; next.awayScore = null; next.homePen = null; next.awayPen = null; next.winner = null; } }
                            else { if (next.awayTeam !== 'TBD') { next.awayTeam = 'TBD'; next.homeScore = null; next.awayScore = null; next.homePen = null; next.awayPen = null; next.winner = null; } }
                        }
                    }

                    if (m.loserNext) {
                        let nextL = b.find(x => x.id === m.loserNext);
                        if (nextL) {
                            if (m.winner) {
                                let loser = m.winner === m.homeTeam ? m.awayTeam : m.homeTeam;
                                if (m.id === 'SF-1' && nextL.homeTeam !== loser) nextL.homeTeam = loser;
                                else if (m.id === 'SF-2' && nextL.awayTeam !== loser) nextL.awayTeam = loser;
                            } else {
                                if (m.id === 'SF-1' && nextL.homeTeam !== 'TBD') { nextL.homeTeam = 'TBD'; nextL.homeScore = null; nextL.awayScore = null; nextL.homePen = null; nextL.awayPen = null; nextL.winner = null; }
                                else if (m.id === 'SF-2' && nextL.awayTeam !== 'TBD') { nextL.awayTeam = 'TBD'; nextL.homeScore = null; nextL.awayScore = null; nextL.homePen = null; nextL.awayPen = null; nextL.winner = null; }
                            }
                        }
                    }
                });
            });

            return b;
        };

        const Modal = ({ title, message, onConfirm, onCancel, confirmText = "Confirm", isAlert = false }) => (
            <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-sm animate-fade-in border border-gray-100">
                    <h3 className="text-xl font-black text-gray-900 mb-2">{title}</h3>
                    <p className="text-gray-600 mb-6 font-medium text-sm">{message}</p>
                    <div className="flex justify-end gap-3">
                        {!isAlert && <button onClick={onCancel} className="px-4 py-2.5 rounded-xl font-bold text-gray-500 hover:bg-gray-100 transition">Cancel</button>}
                        <button onClick={onConfirm} className={`px-4 py-2.5 rounded-xl font-black text-white transition shadow-sm ${isAlert ? 'bg-indigo-600 hover:bg-indigo-700 w-full' : 'bg-red-600 hover:bg-red-700'}`}>
                            {confirmText}
                        </button>
                    </div>
                </div>
            </div>
        );

        const ValueScroller = ({ value, onChange, disabled, isPenalty = false, compact = false }) => {
            const handleInc = () => { 
                if (disabled) return;
                onChange(value === null ? 1 : Number(value) + 1); 
            };
            const handleDec = () => { 
                if (disabled) return;
                if (value === null || Number(value) === 0) onChange(0);
                else if (Number(value) === 1) onChange(null);
                else onChange(Number(value) - 1);
            };
            
            const btnClass = compact ? 'w-5 h-6 text-sm' : 'w-7 h-8 text-lg';
            const valClass = compact ? 'w-5 h-6 text-xs' : 'w-7 h-8 text-sm';
            
            return (
                <div className={`flex items-center rounded-lg overflow-hidden shrink-0 ${isPenalty ? 'bg-indigo-100 text-indigo-900' : 'bg-gray-200 text-gray-900'}`}>
                    <button onClick={handleDec} disabled={disabled} className={`${btnClass} flex items-center justify-center font-black transition ${isPenalty ? 'text-indigo-700 hover:bg-indigo-200' : 'text-gray-700 hover:bg-gray-300'} disabled:opacity-50`}>-</button>
                    <div className={`${valClass} flex items-center justify-center font-black tabular-nums ${isPenalty ? 'bg-indigo-100 text-indigo-900' : 'bg-gray-200 text-gray-900'}`}>
                        {value === null ? '-' : value}
                    </div>
                    <button onClick={handleInc} disabled={disabled} className={`${btnClass} flex items-center justify-center font-black transition ${isPenalty ? 'text-indigo-700 hover:bg-indigo-200' : 'text-gray-700 hover:bg-gray-300'} disabled:opacity-50`}>+</button>
                </div>
            );
        };

        const BracketMatchBox = ({ m, updateMatch, readOnly }) => {
            if (!m) return null;
            const isTbd = m.homeTeam === 'TBD' || m.awayTeam === 'TBD' || m.homeTeam.includes('Grp') || m.homeTeam.includes('Best');
            const isDraw = !isTbd && m.homeScore !== null && m.awayScore !== null && m.homeScore === m.awayScore;
            const isFinal = m.round === 'The Final';
            const isThird = m.round === '3rd Place';
            
            return (
                <div className={`w-[320px] sm:w-[340px] bg-white border ${m.winner ? 'border-indigo-400 shadow-md ring-1 ring-indigo-100' : 'border-gray-200 shadow-sm'} rounded-xl flex flex-col shrink-0 transition-all relative overflow-hidden my-auto`}>
                    {isFinal && (
                        <div className="bg-indigo-900 text-white text-[10px] font-black py-1 px-3 text-center tracking-widest uppercase border-b border-indigo-800 shrink-0">
                            THE FINAL
                        </div>
                    )}
                    {isThird && (
                        <div className="bg-slate-700 text-white text-[10px] font-black py-1 px-3 text-center tracking-widest uppercase border-b border-slate-600 shrink-0">
                            3RD PLACE MATCH
                        </div>
                    )}
                    {isFinal && m.winner && (
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 text-center text-[10px] font-black py-0.5 px-3 rounded-full uppercase tracking-wider whitespace-nowrap shadow-sm z-10 bg-amber-400 text-amber-900">
                            {m.winner} Champion
                        </div>
                    )}
                    {isThird && m.winner && (
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 text-center text-[10px] font-black py-0.5 px-3 rounded-full uppercase tracking-wider whitespace-nowrap shadow-sm z-10 bg-slate-300 text-slate-800">
                            {m.winner} 3rd Place
                        </div>
                    )}
                    <div className="p-2 flex flex-col justify-center space-y-1.5 h-full z-0">
                        {/* Home Team Row */}
                        <div className="bg-gray-50 p-1.5 rounded-lg border border-gray-100 shadow-sm flex items-center justify-between gap-1 h-[46px]">
                            <div className="flex items-center gap-2 min-w-0 pr-1 overflow-hidden flex-1">
                                {(!isTbd && getFlagUrl(m.homeTeam)) && <img src={getFlagUrl(m.homeTeam)} className="w-5 h-5 object-cover rounded shadow-sm shrink-0" alt=""/>}
                                <span className={`font-bold truncate text-xs ${m.winner === m.homeTeam ? 'text-indigo-700 font-black' : 'text-gray-700'}`}>{m.homeTeam}</span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                <ValueScroller value={m.homeScore} onChange={(v) => updateMatch(m.id, 'homeScore', v)} disabled={readOnly || isTbd} />
                                {isDraw && (
                                    <div className="flex items-center gap-1 bg-indigo-50/80 p-0.5 rounded border border-indigo-100 shadow-inner animate-fade-in">
                                        <span className="text-[9px] font-black text-indigo-400 pl-1 uppercase">P</span>
                                        <ValueScroller value={m.homePen} onChange={(v) => updateMatch(m.id, 'homePen', v)} disabled={readOnly || isTbd} isPenalty={true} compact={true} />
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Away Team Row */}
                        <div className="bg-gray-50 p-1.5 rounded-lg border border-gray-100 shadow-sm flex items-center justify-between gap-1 h-[46px]">
                            <div className="flex items-center gap-2 min-w-0 pr-1 overflow-hidden flex-1">
                                {(!isTbd && getFlagUrl(m.awayTeam)) && <img src={getFlagUrl(m.awayTeam)} className="w-5 h-5 object-cover rounded shadow-sm shrink-0" alt=""/>}
                                <span className={`font-bold truncate text-xs ${m.winner === m.awayTeam ? 'text-indigo-700 font-black' : 'text-gray-700'}`}>{m.awayTeam}</span>
                            </div>
                            <div className="flex items-center gap-1.5 shrink-0">
                                <ValueScroller value={m.awayScore} onChange={(v) => updateMatch(m.id, 'awayScore', v)} disabled={readOnly || isTbd} />
                                {isDraw && (
                                    <div className="flex items-center gap-1 bg-indigo-50/80 p-0.5 rounded border border-indigo-100 shadow-inner animate-fade-in">
                                        <span className="text-[9px] font-black text-indigo-400 pl-1 uppercase">P</span>
                                        <ValueScroller value={m.awayPen} onChange={(v) => updateMatch(m.id, 'awayPen', v)} disabled={readOnly || isTbd} isPenalty={true} compact={true} />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const SetupPhase = ({ tourneyName, setTourneyName, numGroups, setNumGroups, pots, setPots, setGroups, setMatches, setBracket, setView, saveState, setAlertData, drawSpeed, setDrawSpeed }) => {
            const [inputTeam, setInputTeam] = useState("");
            const [selectedSlot, setSelectedSlot] = useState(null);
            
            useEffect(() => { 
                setPots(prev => {
                    const next = prev.map(p => p.slice(0, numGroups));
                    if (JSON.stringify(prev) !== JSON.stringify(next)) return next;
                    return prev;
                });
            }, [numGroups, setPots]);

            const handleAddTeams = (e) => {
                e.preventDefault();
                const raw = inputTeam.trim();
                if (!raw) return;
                const names = raw.split(',').map(n => n.trim()).filter(Boolean);
                if (names.length === 0) return;

                saveState();
                let newPots = [...pots.map(p => [...p])];
                
                names.forEach(newTeam => {
                    if (newPots.some(p => p.includes(newTeam))) return;
                    for (let i = 0; i < 4; i++) {
                        if (newPots[i].length < numGroups) {
                            newPots[i].push(newTeam);
                            break;
                        }
                    }
                });
                setPots(newPots);
                setInputTeam("");
            };

            const autoFillTeams = () => {
                saveState();
                let used = pots.flat();
                let available = [...ALL_TEAMS].filter(t => !used.includes(t));
                for (let i = available.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [available[i], available[j]] = [available[j], available[i]];
                }
                
                let newPots = [...pots.map(p => [...p])];
                let count = 0;
                for (let i = 0; i < 4; i++) {
                    while (newPots[i].length < numGroups && count < available.length) {
                        newPots[i].push(available[count]);
                        count++;
                    }
                }
                setPots(newPots);
                setSelectedSlot(null);
            };

            const startLiveDraw = () => {
                if (pots.some(p => p.length < numGroups)) { setAlertData({ title: "Incomplete", message: "Fill all pots before drawing." }); return; }
                saveState();
                setView('live-draw');
            };

            const skipDrawAndFill = () => {
                if (pots.some(p => p.length < numGroups)) { setAlertData({ title: "Incomplete", message: "Fill all pots first." }); return; }
                saveState();
                
                let finalGroups = Array.from({ length: numGroups }, () => []);
                for (let potIdx = 0; potIdx < 4; potIdx++) {
                    for (let g = 0; g < numGroups; g++) {
                        finalGroups[g].push(pots[potIdx][g]);
                    }
                }
                setGroups(finalGroups);
                setMatches(generateFixtures(finalGroups));
                setBracket(generateKnockoutBracket(numGroups));
                setView('tournament');
            };

            const handleSlotClick = (potIdx, teamIdx) => {
                if (!selectedSlot) {
                    setSelectedSlot({ potIdx, teamIdx });
                } else {
                    if (selectedSlot.potIdx === potIdx && selectedSlot.teamIdx === teamIdx) {
                        setSelectedSlot(null); return;
                    }
                    saveState();
                    let newPots = [...pots.map(p => [...p])];
                    const source = newPots[selectedSlot.potIdx][selectedSlot.teamIdx];
                    const target = newPots[potIdx][teamIdx];
                    
                    newPots[selectedSlot.potIdx][selectedSlot.teamIdx] = target;
                    newPots[potIdx][teamIdx] = source;
                    
                    setPots(newPots);
                    setSelectedSlot(null);
                }
            };

            const handleEmptySlotClick = (potIdx) => {
                if (!selectedSlot) return;
                saveState();
                let newPots = [...pots.map(p => [...p])];
                const source = newPots[selectedSlot.potIdx].splice(selectedSlot.teamIdx, 1)[0];
                newPots[potIdx].push(source);
                setPots(newPots);
                setSelectedSlot(null);
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6 pb-20 animate-fade-in w-full">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                        <div className="flex flex-col gap-6">
                            <div>
                                <label className="text-xs font-black text-gray-500 uppercase tracking-widest mb-2 block">Tournament Name</label>
                                <input type="text" value={tourneyName} onChange={(e) => setTourneyName(e.target.value)} className="text-2xl font-black text-gray-900 border-b-2 border-gray-200 focus:border-indigo-600 outline-none w-full bg-transparent pb-1 transition" />
                            </div>
                            <div>
                                <label className="text-xs font-black text-gray-500 uppercase tracking-widest mb-2 block">Number of Groups</label>
                                <div className="grid grid-cols-6 gap-2">
                                    {[2, 3, 4, 6, 8, 12].map(n => (
                                        <button key={n} onClick={() => { saveState(); setNumGroups(n); setSelectedSlot(null); }} className={`py-2 text-sm font-black rounded-lg transition border ${numGroups === n ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100'}`}>{n}</button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                        <div className="flex justify-between items-end mb-6 border-b border-gray-100 pb-4">
                            <div>
                                <h2 className="text-xl font-black text-gray-900 tracking-tight">Set Draw</h2>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => { saveState(); setPots(Array(4).fill([])); setSelectedSlot(null); }} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-black text-xs transition shadow-sm border border-gray-200">Clear</button>
                                <button onClick={autoFillTeams} className="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-xl font-black text-xs transition shadow-sm border border-indigo-200">Complete</button>
                            </div>
                        </div>

                        <form onSubmit={handleAddTeams} className="flex gap-3 mb-6">
                            <input type="text" value={inputTeam} onChange={(e) => setInputTeam(e.target.value)} placeholder="Add teams" className="flex-1 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 font-bold text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition" />
                            <button type="submit" className="bg-gray-900 hover:bg-gray-800 text-white px-6 py-3 rounded-xl font-black shadow-sm transition">Add</button>
                        </form>
                        
                        {selectedSlot && <div className="text-xs font-bold text-indigo-600 mb-4 bg-indigo-50 p-2 rounded-lg text-center animate-pulse">Tap another team to swap, or tap an empty slot to move.</div>}

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {pots.map((pot, idx) => (
                                <div key={idx} className="bg-gray-50 rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                                    <div className="bg-gray-100 px-4 py-2.5 border-b border-gray-200 flex justify-between items-center">
                                        <span className="font-black text-gray-700 text-sm">POT {idx + 1}</span>
                                        <span className="text-xs font-bold text-gray-500 bg-white px-2 py-0.5 rounded shadow-sm border border-gray-200">{pot.length} / {numGroups}</span>
                                    </div>
                                    <div className="p-2 min-h-[120px] grid grid-cols-2 gap-1.5 content-start">
                                        {pot.map((team, tIdx) => {
                                            const isSelected = selectedSlot?.potIdx === idx && selectedSlot?.teamIdx === tIdx;
                                            return (
                                            <div key={tIdx} 
                                                 onClick={() => handleSlotClick(idx, tIdx)}
                                                 className={`bg-white border rounded-lg px-2 py-1.5 text-xs font-bold text-gray-700 flex items-center justify-between shadow-sm group cursor-pointer transition ${isSelected ? 'border-indigo-500 ring-2 ring-indigo-200' : 'border-gray-200 hover:border-indigo-300'}`}>
                                                <div className="flex items-center gap-1.5 flex-1 min-w-0 pr-1">
                                                    {getFlagUrl(team) && <img src={getFlagUrl(team)} className="w-4 h-4 object-cover rounded shadow-sm shrink-0" alt=""/>}
                                                    <span className="truncate">{team}</span>
                                                </div>
                                                <button type="button" onClick={(e) => {
                                                    e.stopPropagation(); saveState();
                                                    let newPots = [...pots.map(p => [...p])]; newPots[idx].splice(tIdx, 1); setPots(newPots); setSelectedSlot(null);
                                                }} className="text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition shrink-0 ml-1">
                                                    <Icon name="x" className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                            );
                                        })}
                                        {pot.length < numGroups && Array.from({ length: numGroups - pot.length }).map((_, i) => (
                                            <div key={`empty-${i}`} 
                                                 onClick={() => handleEmptySlotClick(idx)}
                                                 className={`border border-dashed rounded-lg px-2 py-1.5 text-xs font-bold flex items-center justify-center cursor-pointer transition ${selectedSlot ? 'border-indigo-400 bg-indigo-50/50 text-indigo-500 hover:bg-indigo-100' : 'border-gray-300 text-gray-400 bg-gray-50/50'}`}>Empty Slot</div>
                                        ))}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-indigo-900 rounded-2xl p-6 shadow-lg border border-indigo-800 text-center flex flex-col items-center">
                        <label className="text-[10px] font-black text-indigo-300 uppercase tracking-widest mb-3">Draw Speed</label>
                        <div className="flex w-full max-w-sm bg-indigo-950 p-1 rounded-xl shadow-inner mb-6 border border-indigo-800/50">
                            {[{ l: 'Instant', v: 0 }, { l: 'Fast', v: 100 }, { l: 'Normal', v: 400 }, { l: 'Slow', v: 1000 }].map(s => (
                                <button key={s.v} type="button" onClick={() => setDrawSpeed(s.v)} className={`flex-1 py-2 text-[10px] font-black rounded-lg transition ${Number(drawSpeed) === s.v ? 'bg-indigo-600 text-white shadow-md' : 'text-indigo-400 hover:text-indigo-200'}`}>
                                    {s.l}
                                </button>
                            ))}
                        </div>
                        <div className="flex flex-col sm:flex-row gap-4 w-full max-w-md justify-center">
                            <button onClick={skipDrawAndFill} className="flex-1 bg-indigo-800 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-black shadow-md transition border border-indigo-600">Fill Manually</button>
                            <button onClick={startLiveDraw} className="flex-1 bg-green-500 hover:bg-green-400 text-white px-6 py-3 rounded-xl font-black shadow-md transition transform hover:scale-105">Start Draw</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LiveDraw = ({ numGroups, pots, setGroups, setMatches, setBracket, setView, saveState, drawSpeed }) => {
            const getValidRandomizedGroups = () => {
                let attempts = 0;
                while (attempts < 1000) {
                    let g = Array.from({ length: numGroups }, () => []);
                    let randomizedPots = pots.map(pot => {
                        let shuffled = [...pot];
                        for (let i = shuffled.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                        }
                        return shuffled;
                    });
                    
                    for (let potIdx = 0; potIdx < 4; potIdx++) {
                        for (let groupIdx = 0; groupIdx < numGroups; groupIdx++) {
                            g[groupIdx].push(randomizedPots[potIdx][groupIdx]);
                        }
                    }
                    
                    let valid = true;
                    for (let groupIdx = 0; groupIdx < numGroups; groupIdx++) {
                        let uefaCount = g[groupIdx].filter(t => UEFA_TEAMS.includes(t)).length;
                        if (uefaCount > 2) { valid = false; break; }
                    }
                    
                    if (valid) return g;
                    attempts++;
                }
                
                let g = Array.from({ length: numGroups }, () => []);
                let randomizedPots = pots.map(pot => {
                    let shuffled = [...pot];
                    for (let i = shuffled.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                    }
                    return shuffled;
                });
                for (let potIdx = 0; potIdx < 4; potIdx++) {
                    for (let groupIdx = 0; groupIdx < numGroups; groupIdx++) {
                        g[groupIdx].push(randomizedPots[potIdx][groupIdx]);
                    }
                }
                return g;
            };

            const [assignedGroups, setAssignedGroups] = useState(getValidRandomizedGroups);
            const [drawIndex, setDrawIndex] = useState(0);
            
            const totalTeams = numGroups * 4;
            const drawComplete = drawIndex >= totalTeams;

            const handleRedraw = () => {
                setAssignedGroups(getValidRandomizedGroups());
                setDrawIndex(0);
            };

            useEffect(() => {
                if (drawIndex >= totalTeams) return;
                if (Number(drawSpeed) === 0) {
                    setDrawIndex(totalTeams);
                    return;
                }
                const timer = setTimeout(() => { setDrawIndex(prev => prev + 1); }, Number(drawSpeed));
                return () => clearTimeout(timer);
            }, [drawIndex, drawSpeed, totalTeams]);

            const liveGroups = useMemo(() => {
                let g = Array.from({ length: numGroups }, () => []);
                let count = 0;
                for (let potIdx = 0; potIdx < 4; potIdx++) {
                    for (let groupIdx = 0; groupIdx < numGroups; groupIdx++) {
                        if (count < drawIndex) {
                            g[groupIdx].push(assignedGroups[groupIdx][potIdx]);
                            count++;
                        }
                    }
                }
                return g;
            }, [drawIndex, numGroups, assignedGroups]);

            const finishDraw = () => {
                saveState();
                let finalGroups = assignedGroups;
                
                setGroups(finalGroups);
                setMatches(generateFixtures(finalGroups));
                setBracket(generateKnockoutBracket(numGroups));
                setView('tournament');
            };

            const currentPotIndex = drawComplete ? -1 : Math.floor(drawIndex / numGroups);

            return (
                <div className="max-w-5xl mx-auto flex flex-col items-center py-4 sm:py-8 w-full">
                    <div className="w-full flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-black text-gray-900 tracking-tight">Draw</h2>
                        <div className="flex gap-2">
                            <button onClick={handleRedraw} className="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2.5 rounded-xl font-black text-xs transition shadow-sm flex items-center gap-1.5"><Icon name="refresh-cw" className="w-4 h-4"/> Redraw</button>
                            {drawComplete && (
                                <button onClick={finishDraw} className="bg-green-600 hover:bg-green-700 text-white px-6 py-2.5 rounded-xl font-black shadow-md transition animate-pulse">Continue</button>
                            )}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-3 w-full">
                        {liveGroups.map((g, idx) => (
                            <div key={idx} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                                <div className="bg-gray-900 text-white py-1.5 text-center text-[10px] font-black tracking-widest border-b-2 border-indigo-500">GROUP {String.fromCharCode(65 + idx)}</div>
                                <div className="flex-1 p-2 flex flex-col justify-between space-y-1">
                                    {[0, 1, 2, 3].map(pos => {
                                        const isDrawingThis = currentPotIndex === pos && !drawComplete && Number(drawSpeed) !== 0;
                                        return (
                                            <div key={pos} className="bg-gray-50 border border-gray-100 rounded p-1.5 flex items-center h-[32px] overflow-hidden shadow-sm">
                                                {g[pos] ? (
                                                    <div className="flex items-center gap-2 w-full animate-fade-in min-w-0 pr-1">
                                                        {getFlagUrl(g[pos]) && <img src={getFlagUrl(g[pos])} className="w-4 h-4 rounded-sm object-cover shadow-sm shrink-0" alt=""/>}
                                                        <span className="font-bold text-gray-800 text-[10px] truncate">{g[pos]}</span>
                                                    </div>
                                                ) : (
                                                    <div className="w-full h-full flex items-center justify-center opacity-30">
                                                        {isDrawingThis ? (
                                                            <div className="w-3.5 h-3.5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                                        ) : <span className="text-[10px] font-bold">---</span>}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const GroupStage = ({ groups, matches, setMatches, numGroups, saveState }) => {
            const [expandedGroups, setExpandedGroups] = useState({});
            
            const toggleGroup = (label) => {
                setExpandedGroups(prev => ({ ...prev, [label]: !prev[label] }));
            };

            const expandAll = () => {
                let all = {};
                groups.forEach((_, idx) => { all[String.fromCharCode(65 + idx)] = true; });
                setExpandedGroups(all);
            };

            const collapseAll = () => {
                setExpandedGroups({});
            };
            
            const updateScore = (id, field, val) => {
                saveState();
                setMatches(prev => prev.map(m => m.id === id ? { ...m, [field]: val } : m));
            };

            const autoFillScores = () => {
                saveState();
                setMatches(prev => prev.map(m => {
                    if (m.homeScore === null || m.awayScore === null) {
                        return { ...m, homeScore: Math.floor(Math.random() * 4), awayScore: Math.floor(Math.random() * 4) };
                    }
                    return m;
                }));
            };

            return (
                <div className="max-w-7xl mx-auto space-y-6 pb-20 w-full animate-fade-in pt-4">
                    <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-200 gap-4">
                        <div className="flex items-center gap-3">
                            <h2 className="text-xl font-black text-gray-900 tracking-tight uppercase">Group Stage</h2>
                        </div>
                        <div className="flex flex-wrap gap-2 justify-center">
                            <button onClick={expandAll} className="bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-2 rounded-xl font-bold text-xs transition shadow-sm border border-gray-200">Expand All</button>
                            <button onClick={collapseAll} className="bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-2 rounded-xl font-bold text-xs transition shadow-sm border border-gray-200">Collapse All</button>
                            <button onClick={autoFillScores} className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-xl font-bold text-xs transition shadow-sm border border-indigo-200">Auto-Fill Missing</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">
                        {getAllGroupStandings(groups, matches).map((gData, i) => {
                            const isExpanded = !!expandedGroups[gData.label];
                            return (
                                <div key={i} className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col">
                                    <div className="bg-gray-900 p-3 flex justify-between items-center cursor-pointer" onClick={() => toggleGroup(gData.label)}>

                                        <div className="text-white flex items-center gap-1 text-xs font-bold">
                                            <span>{isExpanded ? 'Hide Fixtures' : 'Show Fixtures'}</span>

                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs text-left">

                                                <tr>
                                                    <th className="px-3 py-2 w-8">#</th>
                                                    <th className="px-2 py-2">Team</th>
                                                    <th className="px-2 py-2 text-center font-bold text-indigo-700 bg-indigo-50">Pts</th>
                                                    <th className="px-2 py-2 text-center">P</th>
                                                    <th className="px-2 py-2 text-center">W</th>
                                                    <th className="px-2 py-2 text-center">D</th>
                                                    <th className="px-2 py-2 text-center">L</th>
                                                    <th className="px-2 py-2 text-center">GD</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {gData.standings.map((st, idx) => (
                                                    <tr key={idx} className={`border-b border-gray-100 last:border-0 ${idx < 2 ? 'bg-green-50/30' : (idx === 2 && [3, 6, 12].includes(numGroups) ? 'bg-amber-50/30' : 'bg-white')} hover:bg-gray-50 transition`}>
                                                        <td className="px-3 py-2.5 font-black text-gray-400">{idx + 1}</td>
                                                        <td className="px-2 py-2.5 font-bold flex items-center gap-1.5 min-w-[140px]">
                                                            {getFlagUrl(st.team) && <img src={getFlagUrl(st.team)} className="w-4 h-4 rounded-sm shadow-sm shrink-0 object-cover" alt=""/>}
                                                            <span className="truncate">{st.team}</span>
                                                        </td>
                                                        <td className="px-2 py-2.5 text-center font-black text-indigo-700 bg-indigo-50/50">{st.pts}</td>
                                                        <td className="px-2 py-2.5 text-center text-gray-600">{st.p}</td>
                                                        <td className="px-2 py-2.5 text-center text-gray-600">{st.w}</td>
                                                        <td className="px-2 py-2.5 text-center text-gray-600">{st.d}</td>
                                                        <td className="px-2 py-2.5 text-center text-gray-600">{st.l}</td>
                                                        <td className="px-2 py-2.5 text-center font-bold text-gray-800">{st.gd > 0 ? `+${st.gd}` : st.gd}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    {isExpanded && (
                                        <div className="p-3 bg-gray-50/80 border-t border-gray-200 space-y-4 animate-fade-in">
                                            {[1, 2, 3].map(round => {
                                                const roundMatches = matches.filter(m => m.group === gData.label && m.round === round);
                                                return (
                                                    <div key={round} className="space-y-1.5">
                                                        <div className="text-[10px] font-black text-gray-400 uppercase tracking-widest pl-1">Round {round}</div>
                                                        {roundMatches.map(m => {
                                                            const isEmpty = m.homeScore === null || m.awayScore === null;
                                                            return (
                                                                <div key={m.id} className={`bg-white rounded-lg p-2 border shadow-sm ${isEmpty ? 'border-red-400 ring-1 ring-red-100' : 'border-gray-200'}`}>
                                                                    <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-1 w-full">
                                                                        <div className="flex items-center gap-1 justify-end min-w-0 pr-1">
                                                                            <span className={`truncate text-xs font-bold text-right ${(m.homeScore !== null && Number(m.homeScore) > Number(m.awayScore)) ? 'text-indigo-700' : 'text-gray-700'}`}>{getAbbr(m.homeTeam)}</span>
                                                                            {getFlagUrl(m.homeTeam) && <img src={getFlagUrl(m.homeTeam)} className="w-4 h-4 shrink-0 object-cover rounded-sm border border-gray-100" alt=""/>}
                                                                        </div>
                                                                        
                                                                        <div className="flex items-center gap-1 shrink-0 bg-gray-50 px-1.5 py-1 rounded-md border border-gray-100 justify-center">
                                                                            <ValueScroller value={m.homeScore} onChange={(v) => updateScore(m.id, 'homeScore', v)} />
                                                                            <span className="text-gray-300 font-bold px-0.5 text-xs">-</span>
                                                                            <ValueScroller value={m.awayScore} onChange={(v) => updateScore(m.id, 'awayScore', v)} />
                                                                        </div>
                                                                        
                                                                        <div className="flex items-center gap-1 justify-start min-w-0 pl-1">
                                                                            {getFlagUrl(m.awayTeam) && <img src={getFlagUrl(m.awayTeam)} className="w-4 h-4 shrink-0 object-cover rounded-sm border border-gray-100" alt=""/>}
                                                                            <span className={`truncate text-xs font-bold text-left ${(m.awayScore !== null && Number(m.awayScore) > Number(m.homeScore)) ? 'text-indigo-700' : 'text-gray-700'}`}>{getAbbr(m.awayTeam)}</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const KnockoutStage = ({ groups, matches, numGroups, bracket, setBracket, saveState, setView, setAlertData, tourneyName }) => {
            const isGroupStageComplete = matches.every(m => m.homeScore !== null && m.awayScore !== null);
            const syncedBracket = useMemo(() => syncBracketWithGroups(groups, matches, numGroups, bracket), [groups, matches, numGroups, bracket]);

            const handleMatchUpdate = (id, field, value) => {
                if (!isGroupStageComplete) return;
                saveState();
                setBracket(prev => {
                    let b = JSON.parse(JSON.stringify(prev));
                    let mIndex = b.findIndex(x => x.id === id);
                    if (mIndex !== -1) {
                        b[mIndex][field] = value;
                    }
                    return b;
                });
            };

            const completeTournament = () => {
                saveState();
                let finalM = syncedBracket.find(x => x.id === 'FIN');
                let thirdM = syncedBracket.find(x => x.id === '3RD');
                let hist = {
                    id: Date.now(), name: tourneyName,
                    champion: finalM.winner, runnerUp: finalM.winner === finalM.homeTeam ? finalM.awayTeam : finalM.homeTeam,
                    third: thirdM?.winner || 'N/A', bracket: syncedBracket, groups, matches, numGroups
                };
                const existing = JSON.parse(localStorage.getItem('soccer_hall_of_fame') || '[]');
                localStorage.setItem('soccer_hall_of_fame', JSON.stringify([hist, ...existing]));
                setAlertData({ title: "Tournament Complete!", message: `${finalM.winner} is the Champion! Saved to Hall of Fame.` });
                setView('hall-of-fame');
            };

            const phases = {};
            syncedBracket.filter(m => m.id !== '3RD' && m.id !== 'FIN').forEach(m => {
                if (!phases[m.phase]) phases[m.phase] = [];
                phases[m.phase].push(m);
            });
            
            const finalsPhase = syncedBracket.find(m => m.id === 'FIN')?.phase;
            if (finalsPhase) {
                phases[finalsPhase] = [
                    syncedBracket.find(m => m.id === 'FIN'),
                    syncedBracket.find(m => m.id === '3RD')
                ].filter(Boolean);
            }

            const phaseKeys = Object.keys(phases).sort((a, b) => a - b);
            const isAllFinished = syncedBracket.find(m => m.id === 'FIN')?.winner;
            
            const maxMatches = Math.max(...phaseKeys.map(k => phases[k].length));
            const bracketMinHeight = Math.max(400, maxMatches * 140); 
            
            return (
                <div className="flex flex-col flex-1 min-h-0 w-full relative bg-[#0f172a] overflow-hidden rounded-xl shadow-inner border-4 border-gray-800">
                    {!isGroupStageComplete && (
                        <div className="bg-amber-400 text-amber-900 py-2 text-xs font-black text-center shadow-md flex items-center justify-center gap-2 mb-2 w-full shrink-0">
                            <Icon name="lock" className="w-4 h-4" /> Complete Group Stage matches to unlock knockout scoring.
                        </div>
                    )}
                    {isGroupStageComplete && isAllFinished && (
                        <div className="bg-green-500 text-white p-3 flex justify-between items-center shadow-md px-6 shrink-0">
                            <span className="font-black text-sm tracking-widest uppercase">Tournament Complete!</span>
                            <button onClick={completeTournament} className="bg-white text-green-700 px-4 py-1.5 rounded-xl font-black text-xs hover:bg-gray-100 transition shadow-lg">Save to Hall of Fame</button>
                        </div>
                    )}

                    <div className="flex-1 overflow-auto bracket-scroll p-4 md:p-8">
                        <div className="flex gap-12 md:gap-16 min-w-max pt-4 pb-16" style={{ minHeight: `${bracketMinHeight}px` }}>
                            {phaseKeys.map(k => {
                                const colMatches = phases[k];
                                const title = colMatches[0]?.round || 'Round';
                                const isFinalsPhase = title === 'The Final' || title === '3rd Place';
                                
                                return (
                                    <div key={k} className="flex flex-col min-w-[320px] sm:min-w-[340px]">
                                        <h3 className="text-center font-black text-slate-400 text-xs uppercase tracking-widest bg-[#1e293b] py-2 rounded-lg border border-slate-700 shadow-sm z-20 mb-6 shrink-0">
                                            {isFinalsPhase ? 'Finals & 3rd Place' : title}
                                        </h3>
                                        <div className="flex flex-col justify-around flex-1 w-full gap-2">
                                            {colMatches.map(m => (
                                                <div key={m.id} className="flex justify-center items-center relative w-full h-[140px] shrink-0">
                                                    <BracketMatchBox m={m} updateMatch={handleMatchUpdate} readOnly={!isGroupStageComplete} />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}

                    </div>
                </div>

        };

        const RoadToFinalDiagram = ({ numGroups, bracket, groups, matches }) => {
