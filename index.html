            const phases = {};
            syncedBracket.filter(m => m.id !== '3RD' && m.id !== 'FIN').forEach(m => {
                if (!phases[m.phase]) phases[m.phase] = [];
                phases[m.phase].push(m);
            });
            const finalsPhase = syncedBracket.find(m => m.id === 'FIN')?.phase;
            if (finalsPhase) {
                phases[finalsPhase] = [
                    syncedBracket.find(m => m.id === 'FIN'),
                    syncedBracket.find(m => m.id === '3RD')
                ].filter(Boolean);
            }
            const phaseKeys = Object.keys(phases).sort((a, b) => a - b);

            const maxMatches = Math.max(...phaseKeys.map(k => phases[k].length));
            const bracketMinHeight = Math.max(500, maxMatches * 140);

            return (
                <div className="max-w-7xl mx-auto p-4 space-y-6 animate-fade-in pb-12 w-full pt-4">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-200 text-center">
                        <h2 className="text-xl font-black text-gray-900 uppercase tracking-tight">Road to Final Diagram</h2>
                        <p className="text-xs text-gray-500 font-bold">Visual overview of the knockout bracket structure</p>
                    </div>
                    <div className="bg-[#0f172a] rounded-2xl shadow-inner border-4 border-gray-800 overflow-auto bracket-scroll max-h-[85vh]">
                        <div className="flex gap-12 md:gap-16 min-w-max mx-auto p-6 md:p-12" style={{ minHeight: `${bracketMinHeight}px` }}>
                            {phaseKeys.map(k => {
                                const colMatches = phases[k];
                                const title = colMatches[0]?.round || 'Round';
                                const isFinalsPhase = title === 'The Final' || title === '3rd Place';
                                
                                return (
                                    <div key={k} className="flex flex-col min-w-[240px]">
                                        <h3 className="text-center font-black text-slate-400 text-xs uppercase tracking-widest bg-[#1e293b] py-2 rounded-lg border border-slate-700 shadow-sm mb-8 shrink-0">
                                            {isFinalsPhase ? 'Finals & 3rd Place' : title}
                                        </h3>
                                        <div className="flex flex-col justify-around flex-1 w-full gap-4">
                                            {colMatches.map(m => {
                                                const isTbdH = m.homeTeam === 'TBD' || m.homeTeam.includes('Grp') || m.homeTeam.includes('Best');
                                                const isTbdA = m.awayTeam === 'TBD' || m.awayTeam.includes('Grp') || m.awayTeam.includes('Best');
                                                return (
                                                    <div key={m.id} className="flex justify-center items-center relative w-full h-[120px] shrink-0">
                                                        <div className="bg-white/10 border border-slate-700 rounded-xl p-3 flex flex-col gap-2 shadow-sm w-full">
                                                            <div className="flex items-center justify-between gap-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                                                                <div className="flex items-center gap-2 min-w-0 pr-1">
                                                                    {!isTbdH && getFlagUrl(m.homeTeam) && <img src={getFlagUrl(m.homeTeam)} className="w-5 h-5 object-cover rounded shadow-sm shrink-0" alt=""/>}
                                                                    <span className="font-bold truncate text-xs text-white">{getAbbr(m.homeTeam)}</span>
                                                                </div>
                                                            </div>
                                                            <div className="flex items-center justify-between gap-2 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                                                                <div className="flex items-center gap-2 min-w-0 pr-1">
                                                                    {!isTbdA && getFlagUrl(m.awayTeam) && <img src={getFlagUrl(m.awayTeam)} className="w-5 h-5 object-cover rounded shadow-sm shrink-0" alt=""/>}
                                                                    <span className="font-bold truncate text-xs text-white">{getAbbr(m.awayTeam)}</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const HallOfFame = ({ setView }) => {
            const history = JSON.parse(localStorage.getItem('soccer_hall_of_fame') || '[]');
            const [selectedArchive, setSelectedArchive] = useState(null);

            const teamStats = useMemo(() => {
                let stats = {};
                history.forEach(h => {
                    const addStat = (team, pos) => {
                        if (!team || team === 'TBD' || team === 'N/A') return;
                        if (!stats[team]) stats[team] = { team, first: 0, second: 0, third: 0, total: 0 };
                        if (pos === 1) stats[team].first++;
                        if (pos === 2) stats[team].second++;
                        if (pos === 3) stats[team].third++;
                        stats[team].total = stats[team].first + stats[team].second + stats[team].third;
                    };
                    addStat(h.champion, 1);
                    addStat(h.runnerUp, 2);
                    addStat(h.third, 3);
                });
                return Object.values(stats).sort((a, b) => b.first - a.first || b.second - a.second || b.third - a.third || b.total - a.total);
            }, [history]);

            if (history.length === 0) return <div className="flex flex-col items-center justify-center h-64 text-gray-400 font-black text-lg gap-3"><Icon name="award" className="w-12 h-12 opacity-50" />No records found in Hall of Fame.</div>;
            
            if (selectedArchive) {
                return (
                    <div className="max-w-4xl mx-auto p-4 animate-fade-in pb-12 w-full pt-4">
                        <button onClick={() => setSelectedArchive(null)} className="mb-4 flex items-center gap-2 text-indigo-600 font-bold hover:text-indigo-800 transition text-sm bg-white px-4 py-2 rounded-xl border border-indigo-100 shadow-sm"><Icon name="arrow-left" className="w-4 h-4"/> Back to Index</button>
                        <div className="bg-white p-6 rounded-2xl shadow border border-gray-200">
                            <h2 className="text-2xl font-black text-gray-900 mb-1">{selectedArchive.name}</h2>
                            <p className="text-gray-400 font-bold uppercase tracking-widest text-xs mb-6">Archive Format: {selectedArchive.numGroups} Groups</p>
                            
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-amber-50 p-4 rounded-xl border border-amber-200 text-center shadow-sm">
                                    <div className="text-2xl mb-2">🏆</div>
                                    <div className="text-xs font-black text-amber-600 uppercase tracking-widest mb-1">Champion</div>
                                    <div className="text-lg font-black text-amber-900 flex justify-center items-center gap-2">{getFlagUrl(selectedArchive.champion) && <img src={getFlagUrl(selectedArchive.champion)} className="w-5 h-5 rounded shadow" alt=""/>}{selectedArchive.champion}</div>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-center shadow-sm">
                                    <div className="text-2xl mb-2">🥈</div>
                                    <div className="text-xs font-black text-slate-500 uppercase tracking-widest mb-1">Runner-up</div>
                                    <div className="text-base font-black text-slate-800 flex justify-center items-center gap-2">{getFlagUrl(selectedArchive.runnerUp) && <img src={getFlagUrl(selectedArchive.runnerUp)} className="w-4 h-4 rounded shadow" alt=""/>}{selectedArchive.runnerUp}</div>
                                </div>
                                <div className="bg-orange-50 p-4 rounded-xl border border-orange-200 text-center shadow-sm">
                                    <div className="text-2xl mb-2">🥉</div>
                                    <div className="text-xs font-black text-orange-600 uppercase tracking-widest mb-1">Third Place</div>
                                    <div className="text-base font-black text-orange-900 flex justify-center items-center gap-2">{getFlagUrl(selectedArchive.third) && <img src={getFlagUrl(selectedArchive.third)} className="w-4 h-4 rounded shadow" alt=""/>}{selectedArchive.third}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-3xl mx-auto p-4 space-y-8 animate-fade-in pb-12 w-full pt-4">
                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-gray-900 p-4">
                            <h2 className="text-lg font-black text-white uppercase tracking-widest">Champions per Edition</h2>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-50 text-[10px] uppercase text-gray-500 font-black border-b border-gray-200">
                                    <tr>
                                        <th className="px-4 py-3 w-20">Edition</th>
                                        <th className="px-4 py-3">Tournament Name</th>
                                        <th className="px-4 py-3 text-center">Champion</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {history.map((h, i) => (
                                        <tr key={h.id} className="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition">
                                            <td className="px-4 py-3 font-black text-gray-400">#{history.length - i}</td>
                                            <td className="px-4 py-3">
                                                <button onClick={() => setSelectedArchive(h)} className="font-black text-indigo-600 hover:text-indigo-800 hover:underline text-sm text-left transition">{h.name}</button>
                                            </td>
                                            <td className="px-4 py-3 text-center">
                                                <div className="inline-flex items-center gap-1.5 bg-amber-100/50 text-amber-900 px-3 py-1.5 rounded-lg font-black text-xs shadow-sm border border-amber-200">
                                                    {getFlagUrl(h.champion) && <img src={getFlagUrl(h.champion)} className="w-4 h-4 rounded shadow-sm object-cover" alt=""/>}
                                                    {h.champion} 🏆
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div className="bg-gray-900 p-4">
                            <h2 className="text-lg font-black text-white uppercase tracking-widest">All-Time Team Standings</h2>
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-50 text-[10px] uppercase text-gray-500 font-black border-b border-gray-200">
                                    <tr>
                                        <th className="px-4 py-3">Team</th>
                                        <th className="px-3 py-3 text-center">1st</th>
                                        <th className="px-3 py-3 text-center">2nd</th>
                                        <th className="px-3 py-3 text-center">3rd</th>
                                        <th className="px-3 py-3 text-center">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {teamStats.map((st, i) => (
                                        <tr key={i} className="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition">
                                            <td className="px-4 py-3 font-bold flex items-center gap-2">
                                                {getFlagUrl(st.team) && <img src={getFlagUrl(st.team)} className="w-4 h-4 rounded shadow-sm object-cover" alt=""/>}
                                                {st.team}
                                            </td>
                                            <td className="px-3 py-3 text-center font-black text-amber-600">{st.first}</td>
                                            <td className="px-3 py-3 text-center font-bold text-slate-600">{st.second}</td>
                                            <td className="px-3 py-3 text-center font-bold text-orange-600">{st.third}</td>
                                            <td className="px-3 py-3 text-center font-black text-indigo-600">{st.total}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('setup'); 
            const [tab, setTab] = useState('groups'); 
            const [tourneyName, setTourneyName] = useState("World Cup");
            const [numGroups, setNumGroups] = useState(4);
            const [pots, setPots] = useState([[], [], [], []]);
            const [groups, setGroups] = useState([]);
            const [matches, setMatches] = useState([]);
            const [bracket, setBracket] = useState([]);
            const [drawSpeed, setDrawSpeed] = useState(400);
            
            const [appHistory, setAppHistory] = useState([]);
            const [menuOpen, setMenuOpen] = useState(false);
            const [alertData, setAlertData] = useState(null);
            const [confirmData, setConfirmData] = useState(null);

            useEffect(() => { window.scrollTo({ top: 0, left: 0, behavior: 'instant' }); }, [view, tab]);

            const saveState = () => {
                setAppHistory(prev => [...prev.slice(-15), JSON.stringify({ tourneyName, numGroups, pots, groups, matches, bracket, view, tab, drawSpeed })]);
            };

            const undo = () => {
                if (appHistory.length === 0) return;
                const prevState = JSON.parse(appHistory[appHistory.length - 1]);
                setTourneyName(prevState.tourneyName); setNumGroups(prevState.numGroups);
                setPots(prevState.pots); setGroups(prevState.groups); setMatches(prevState.matches);
                setBracket(prevState.bracket); setView(prevState.view); setTab(prevState.tab);
                if (prevState.drawSpeed !== undefined) setDrawSpeed(prevState.drawSpeed);
                setAppHistory(prev => prev.slice(0, -1));
                setMenuOpen(false);
            };

            const handleExportJSON = () => {
                const data = JSON.stringify({ tourneyName, numGroups, groups, matches, bracket, pots, view, tab });
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'soccer_manager_backup.json';
                a.click();
                setMenuOpen(false);
            };

            const handleImportJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setConfirmData({
                    title: "Load JSON File",
                    message: "This will overwrite your current tournament data. Proceed?",
                    onConfirm: () => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const p = JSON.parse(e.target.result);
                                if (p.groups) setGroups(p.groups);
                                if (p.matches) setMatches(p.matches);
                                if (p.bracket) setBracket(p.bracket);
                                if (p.pots) setPots(p.pots);
                                if (p.tourneyName) setTourneyName(p.tourneyName);
                                if (p.numGroups) setNumGroups(p.numGroups);
                                setView(p.groups?.length > 0 ? 'tournament' : 'setup'); setTab('groups');
                            } catch (err) { setAlertData({ title: "Error", message: "Invalid JSON backup file." }); }
                        };
                        reader.readAsText(file);
                        setConfirmData(null); setMenuOpen(false);
                        e.target.value = null; 
                    }
                });
            };

            const saveToBrowser = () => {
                setConfirmData({
                    title: "Save Session",
                    message: "This will overwrite any previously saved session. Are you sure you want to proceed?",
                    onConfirm: () => {
                        localStorage.setItem('soccer_manager_save', JSON.stringify({ tourneyName, numGroups, pots, groups, matches, bracket, view, tab }));
                        setAlertData({ title: "Saved", message: "Tournament saved to your browser." });
                        setConfirmData(null);
                        setMenuOpen(false);
                    }
                });
            };

            const loadFromBrowser = () => {
                const saved = localStorage.getItem('soccer_manager_save');
                if (!saved) { setAlertData({ title: "No Save Found", message: "There is no tournament data saved in this browser." }); return; }
                
                setConfirmData({
                    title: "Load Session",
                    message: "Overwrite current session with saved data?",
                    onConfirm: () => {
                        try {
                            const p = JSON.parse(saved);
                            if (p.pots) setPots(p.pots);
                            if (p.groups) setGroups(p.groups);
                            if (p.matches) setMatches(p.matches);
                            if (p.bracket) setBracket(p.bracket);
                            if (p.tourneyName) setTourneyName(p.tourneyName);
                            if (p.numGroups) setNumGroups(p.numGroups);
                            if (p.view) setView(p.view);
                            if (p.tab) setTab(p.tab);
                        } catch (err) { setAlertData({ title: "Error", message: "Corrupted save file." }); }
                        setConfirmData(null); setMenuOpen(false);
                    }
                });
            };

            const resetApp = () => {
                setConfirmData({
                    title: "Reset Application",
                    message: "Completely erase current tournament?",
                    onConfirm: () => {
                        saveState();
                        setView('setup'); setGroups([]); setMatches([]); setBracket([]);
                        setPots(Array(4).fill([]));
                        setConfirmData(null); setMenuOpen(false);
                    }
                });
            };

            const isLocked = view === 'tournament' || view === 'road-to-final-diagram';

            return (
                <div className="min-h-screen flex flex-col relative h-[100dvh]">
                    {alertData && <Modal title={alertData.title} message={alertData.message} onConfirm={() => setAlertData(null)} confirmText="OK" isAlert={true} />}
                    {confirmData && <Modal title={confirmData.title} message={confirmData.message} onConfirm={confirmData.onConfirm} onCancel={() => setConfirmData(null)} />}

                    <header className="bg-gray-900 text-white shadow-md relative z-40 shrink-0">
                        <div className="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
                            <div className="flex items-center gap-2.5">
                                <img src="image_2.png" className="w-8 h-8 object-contain" alt="Logo" onError={(e) => { e.target.style.display = 'none'; }}/>
                                <h1 className="text-base font-black tracking-tight text-white uppercase">The OC'S Cup Maker</h1>
                            </div>
                            
                            <div className="relative">
                                <button onClick={() => setMenuOpen(!menuOpen)} className={`p-2 rounded-lg transition ${menuOpen ? 'bg-indigo-600' : 'hover:bg-gray-800'}`}>
                                    <Icon name="menu" className="w-5 h-5" />
                                </button>
                                
                                {menuOpen && (
                                    <div className="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-2xl py-2 border border-gray-100 text-gray-800 z-50">
                                        <button onClick={undo} disabled={appHistory.length === 0} className="w-full text-left px-4 py-2.5 hover:bg-gray-50 font-black text-xs disabled:opacity-50 flex items-center gap-2.5 text-gray-700"><Icon name="undo-2" className="w-4 h-4 text-gray-400" /> Undo Last Action</button>
                                        <div className="border-t border-gray-100 my-1 mx-3"></div>
                                        
                                        {groups.length > 0 && (
                                            <>
                                                <button onClick={() => { setView('tournament'); setTab('groups'); setMenuOpen(false); }} className="w-full text-left px-4 py-2.5 hover:bg-gray-50 font-black text-xs flex items-center gap-2.5 text-indigo-700"><Icon name="trophy" className="w-4 h-4 text-indigo-500" /> Tournament</button>
                                                <button onClick={() => { setView('road-to-final-diagram'); setMenuOpen(false); }} className="w-full text-left px-4 py-2.5 hover:bg-gray-50 font-black text-xs flex items-center gap-2.5 text-indigo-700"><Icon name="award" className="w-4 h-4 text-indigo-500" /> Road to Final</button>
                                            </>
                                        )}
                                        <button onClick={() => { setView('hall-of-fame'); setMenuOpen(false); }} className="w-full text-left px-4 py-2.5 hover:bg-gray-50 font-black text-xs flex items-center gap-2.5 text-gray-700"><Icon name="award" className="w-4 h-4 text-amber-500" /> Hall of Fame</button>
                                        
                                        <div className="border-t border-gray-100 my-1 mx-3"></div>
                                        <button onClick={saveToBrowser} className="w-full text-left px-4 py-2 hover:bg-indigo-50 font-black text-xs flex items-center gap-2.5 text-indigo-700"><Icon name="save" className="w-4 h-4 text-indigo-400" /> Save Session</button>
                                        <button onClick={loadFromBrowser} className="w-full text-left px-4 py-2 hover:bg-indigo-50 font-black text-xs flex items-center gap-2.5 text-indigo-700"><Icon name="folder-open" className="w-4 h-4 text-indigo-400" /> Load Session</button>

                                        <div className="border-t border-gray-100 my-1 mx-3"></div>
                                        <button onClick={handleExportJSON} className="w-full text-left px-4 py-2 hover:bg-gray-50 font-black text-xs flex items-center gap-2.5 text-gray-700"><Icon name="download" className="w-4 h-4 text-gray-400" /> Export JSON</button>
                                        <label className="w-full text-left px-4 py-2 hover:bg-gray-50 font-black text-xs flex items-center gap-2.5 cursor-pointer text-gray-700">
                                            <Icon name="upload" className="w-4 h-4 text-gray-400" /> Import JSON
                                            <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                                        </label>
                                        
                                        <div className="border-t border-gray-100 my-1 mx-3"></div>
                                        <button onClick={resetApp} className="w-full text-left px-4 py-2.5 hover:bg-red-50 text-red-600 font-black text-xs flex items-center gap-2.5"><Icon name="power" className="w-4 h-4" /> Reset Application</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </header>

                    {isLocked && (
                        <div className="bg-white border-b border-gray-200 shadow-sm relative shrink-0 z-20">
                            <div className="max-w-7xl mx-auto flex">
                                <button onClick={() => { setView('tournament'); setTab('groups'); }} className={`flex-1 py-3 text-xs font-black uppercase tracking-widest transition border-b-4 ${view === 'tournament' && tab === 'groups' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50' : 'border-transparent text-gray-500 hover:text-gray-800 hover:bg-gray-50'}`}>Group Stage</button>
                                <button onClick={() => { setView('tournament'); setTab('knockout'); }} className={`flex-1 py-3 text-xs font-black uppercase tracking-widest transition border-b-4 ${view === 'tournament' && tab === 'knockout' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50' : 'border-transparent text-gray-500 hover:text-gray-800 hover:bg-gray-50'}`}>Knockout</button>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 p-2 sm:p-4 flex flex-col relative min-h-0 w-full overflow-y-auto">
                        {view === 'setup' && (
                            <SetupPhase 
                                tourneyName={tourneyName} setTourneyName={setTourneyName} 
                                numGroups={numGroups} setNumGroups={setNumGroups} 
                                pots={pots} setPots={setPots} 
                                setGroups={setGroups} setMatches={setMatches} setBracket={setBracket} 
                                setView={setView} saveState={saveState} setAlertData={setAlertData} 
                                drawSpeed={drawSpeed} setDrawSpeed={setDrawSpeed}
                            />
                        )}
                        {view === 'live-draw' && (
                            <LiveDraw 
                                numGroups={numGroups} pots={pots} 
                                setGroups={setGroups} setMatches={setMatches} setBracket={setBracket} 
                                setView={setView} saveState={saveState} drawSpeed={drawSpeed}
                            />
                        )}
                        {view === 'tournament' && tab === 'groups' && (
                            <GroupStage 
                                groups={groups} matches={matches} setMatches={setMatches} 
                                numGroups={numGroups} saveState={saveState}
                            />
                        )}
                        {view === 'tournament' && tab === 'knockout' && (
                            <KnockoutStage 
                                groups={groups} matches={matches} numGroups={numGroups} 
                                bracket={bracket} setBracket={setBracket} saveState={saveState} 
                                setView={setView} setAlertData={setAlertData} tourneyName={tourneyName}
                            />
                        )}
                        {view === 'road-to-final-diagram' && (
                            <RoadToFinalDiagram numGroups={numGroups} bracket={bracket} groups={groups} matches={matches} />
                        )}
                        {view === 'hall-of-fame' && <HallOfFame setView={setView} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
